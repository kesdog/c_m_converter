services:
  currency-converter:
    image: currency-converter:latest
    build: .
    container_name: currency-converter
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:${HOST_PORT:-3000}:3000"
    environment:
      APP_PORT: "3000"
      CACHE_DIR: "${CACHE_DIR:-data}"
    volumes:
      - ./data:/app/data
